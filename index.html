<style>
  *{box-sizing:border-box;margin:0;padding:0}

  #ust{position:fixed;top:0;left:0;right:0;height:56px;display:flex;align-items:center;gap:8px;padding:0 10px;background:linear-gradient(90deg,#4338ca,#7c3aed);z-index:10;box-shadow:0 2px 10px rgba(0,0,0,.3)}

  #cerceve{position:fixed;top:56px;left:0;right:0;bottom:0;width:100%;border:none;background:#fff}
  #yukleniyor{position:fixed;top:56px;left:0;right:0;bottom:0;display:flex;align-items:center;justify-content:center;color:#94a3b8;font-weight:700;background:#0f172a;z-index:5}
  .spin{width:26px;height:26px;border:3px solid #334155;border-top-color:#818cf8;border-radius:50%;animation:d 1s linear infinite;margin-right:10px}
  @keyframes d{to{transform:rotate(360deg)}}
</style>

  var aktifUrl = null;
  function b64ToBlobUrl(b64){
    var bin = atob(b64);
    var len = bin.length;
    var bytes = new Uint8Array(len);
    for (var i=0;i<len;i++){ bytes[i] = bin.charCodeAt(i); }
    var blob = new Blob([bytes], { type: 'text/html' });
    return URL.createObjectURL(blob);
  }
  function yukle(key){
    try{
      var yk = document.getElementById('yukleniyor'); if(yk){ yk.style.display='flex'; }
      document.getElementById('btn-floortime').className = (key==='floortime')?'aktif':'';
      document.getElementById('btn-klinik').className = (key==='klinik')?'aktif':'';
      if(aktifUrl){ try{ URL.revokeObjectURL(aktifUrl); }catch(e){} }
      aktifUrl = b64ToBlobUrl(APPS[key]);
      var cf = document.getElementById('cerceve');
      cf.onload = function(){ var y=document.getElementById('yukleniyor'); if(y){ y.style.display='none'; } };
      cf.src = aktifUrl;
    }catch(e){ var y=document.getElementById('yukleniyor'); if(y){ y.innerHTML='Yüklenemedi. Sayfayı yenileyin.'; } }
  }
  yukle('floortime');
